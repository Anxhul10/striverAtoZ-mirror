 updateStats();
 const nav=document.querySelector('#nav'),content=document.querySelector('#content');
 nav.innerHTML=DATA.map(t=>`<button class="navitem ${active===t.topic?'active':''}" data-topic="${esc(t.topic)}"><span>${esc(t.topic)}</span><span class="count">${t.problems.filter(p=>completed.has(p.url)).length}/${t.problems.length}</span></button>`).join('')+`<button class="navitem ${active==='all'?'active':''}" data-topic="all"><span>All topics</span><span class="count">${total}</span></button>`;
 nav.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{active=b.dataset.topic;render();});
 let topics=DATA.filter(t=>active==='all'||t.topic===active);
 let shown=0;
 content.innerHTML=topics.map(t=>{
 let ps=t.problems.filter(p=>(!query||(p.name+' '+t.topic+' '+p.platform).toLowerCase().includes(query))&&(filter==='all'||(filter==='done'?completed.has(p.url):!completed.has(p.url))));
 if(!ps.length)return '';
 shown+=ps.length;
 let groups={};ps.forEach(p=>(groups[p.difficulty||'Problems']??=[]).push(p));
 return `<article class="topic"><div class="topichead" data-toggle="${esc(t.topic)}"><div><h2>${esc(t.topic)}</h2><small>${t.problems.filter(p=>completed.has(p.url)).length} / ${t.problems.length} completed · ${t.problems.length} problems</small></div><span>${openTopics.has(t.topic)?'−':'+'}</span></div><div class="topicbody ${openTopics.has(t.topic)?'':'hide'}">${Object.entries(groups).map(([g,items])=>`<div class="group"><h3>${esc(g)} · ${items.length}</h3>${items.map(p=>`<div class="problem ${completed.has(p.url)?'done':''}"><input type="checkbox" data-check="${esc(p.url)}" ${completed.has(p.url)?'checked':''}><a class="pname" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a><span class="meta">${esc(p.platform)}</span></div>`).join('')}</div>`).join('')}</div></article>`;
 }).join('')||'<div class="empty">No matching problems. Try another search or filter.</div>';
 content.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{let t=el.dataset.toggle;openTopics.has(t)?openTopics.delete(t):openTopics.add(t);render();});
 content.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{let u=el.dataset.check;el.checked?completed.add(u):completed.delete(u);localStorage.setItem(KEY,JSON.stringify([...completed]));render();});
}
document.querySelector('#search').oninput=e=>{query=e.target.value.toLowerCase();render()};
document.querySelector('#filter').onchange=e=>{filter=e.target.value;render()};
document.querySelector('#expand').onclick=()=>{if(openTopics.size===DATA.length){openTopics.clear();}else openTopics=new Set(DATA.map(x=>x.topic));render();};
document.querySelector('#reset').onclick=()=>{if(confirm('Clear all completion progress on this browser?')){completed.clear();localStorage.removeItem(KEY);render();}};
render();
</script></body></html>
